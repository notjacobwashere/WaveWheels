name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build app
        shell: pwsh
        run: ./Build.ps1
      - name: Run component and protocol tests
        shell: pwsh
        run: ./Test.ps1
      - name: Package portable app
        shell: pwsh
        run: ./Package.ps1
      - name: Build self-contained Windows installer
        shell: pwsh
        run: ./BuildInstaller.ps1
      - name: Test install, upgrade, and uninstall
        shell: pwsh
        run: ./TestInstaller.ps1
      - name: Save portable package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WaveWheels-windows-x64
          path: |
            artifacts/WaveWheels-*-windows-x64.zip
            artifacts/WaveWheels-*-windows-x64.zip.sha256
            artifacts/WaveWheels-*-Setup.exe
            artifacts/WaveWheels-*-Setup.exe.sha256
      - name: Save installer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Installer-test-logs
          path: artifacts/installer-*.log
          if-no-files-found: ignore
      - name: Save component renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WPF-component-renders
          path: artifacts/previews/*.png
          if-no-files-found: ignore
